<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 286 196" width="100%" height="196">
  <defs>
    <style>
      
      text { font-family: Geist, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .mono { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .card-bg {
        transition: stroke 0.2s ease, fill 0.2s ease;
      }
      .card-root:hover .card-bg {
        stroke: #FDCA17;
      }
      
    @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .card-root { animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.62s both; }
    
      @media (prefers-reduced-motion: reduce) {
        *, ::before, ::after { animation: none !important; opacity: 1 !important; transform: none !important; }
      }
    </style>
  </defs>

  <g class="card-root">
    <!-- Warm Off-White Paper Body -->
    <rect class="card-bg" x="1" y="1" width="284" height="194" rx="16" fill="#F3F3F0" stroke="#DEDEDA" stroke-width="1"/>

    <!-- 1. Top Header: Square + Repository Name -->
    <rect x="24" y="27" width="7.5" height="7.5" rx="1.5" fill="#FDCA17"/>
    <text x="38" y="35" fill="#151515" font-size="15" font-weight="600" letter-spacing="-0.2">f1-telemetry</text>

    <!-- 2. Description (3 comfortable lines) -->
    <text x="24" y="70" fill="#52524C" font-size="12.5" font-weight="400">High-frequency Formula 1 telemetry</text>
    <text x="24" y="91" fill="#52524C" font-size="12.5" font-weight="400">traces and deterministic lap</text>
    <text x="24" y="112" fill="#52524C" font-size="12.5" font-weight="400">comparison simulation engine.</text>

    <!-- 3. Footer Metadata Row -->
    <text x="24" y="166" fill="#77777D" class="mono" font-size="11" letter-spacing="0.3">Python · live</text>
  </g>
</svg>