name: Update Profile Telemetry & SVGs

on:
  schedule:
    - cron: "0 */12 * * *"  # Every 12 hours
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "assets/**"
      - "cards/**"
      - "generated/**"
      - "data/**"
      - "docs/**"
      - "README.md"

permissions:
  contents: write

concurrency:
  group: profile-telemetry
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated test suite
        run: |
          python -m unittest discover -s tests -v

      - name: Fetch daily contribution data
        run: |
          python scripts/fetch_contributions.py

      - name: Render animated SVG cards
        run: |
          python scripts/render_cards.py

      - name: Execute build pipeline & sync assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/build.py --sync-assets

      - name: Validate SVG security & XML integrity
        run: |
          python scripts/validate.py

      - name: Commit and push updated cards and telemetry
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards/ data/
          if git diff --staged --quiet; then
            echo "✔ No asset changes detected. Repository is up-to-date."
          else
            git commit -m "chore(cards): refresh animated profile cards and contribution telemetry [skip ci]"
            git push
            echo "✔ Pushed updated animated cards to main."
          fi
