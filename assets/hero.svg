<svg width="100%" viewBox="0 0 1000 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Cosmic Void -->
    <linearGradient id="cosmicVoid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020205"/>
      <stop offset="20%" stop-color="#060810"/>
      <stop offset="50%" stop-color="#0A0E1A"/>
      <stop offset="80%" stop-color="#060810"/>
      <stop offset="100%" stop-color="#020205"/>
    </linearGradient>

    <!-- Nebula Core Glow -->
    <radialGradient id="nebulaCyan" cx="78%" cy="42%" r="35%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.14"/>
      <stop offset="40%" stop-color="#00F0FF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nebulaFlame" cx="20%" cy="60%" r="40%">
      <stop offset="0%" stop-color="#FF5722" stop-opacity="0.10"/>
      <stop offset="40%" stop-color="#FF5722" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#FF5722" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nebulaEmerald" cx="50%" cy="20%" r="30%">
      <stop offset="0%" stop-color="#00E676" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#00E676" stop-opacity="0"/>
    </radialGradient>

    <!-- Name Iridescence -->
    <linearGradient id="nameIridescent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#E2E8F0"/>
      <stop offset="60%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <!-- Orbit Path Gradient -->
    <linearGradient id="orbitGradCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="orbitGradFlame" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9100" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#FF9100" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FF9100" stop-opacity="0.45"/>
    </linearGradient>

    <linearGradient id="orbitGradEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E676" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#00E676" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#00E676" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Hull Rim -->
    <linearGradient id="hullRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.6"/>
      <stop offset="25%" stop-color="#0F172A" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.1"/>
      <stop offset="75%" stop-color="#0F172A" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FF5722" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Constellation Line Gradient -->
    <linearGradient id="constellationLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FF9100" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="starGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="b1"/>
      <feGaussianBlur stdDeviation="18" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="electronGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="nameGlowUltra" x="-15%" y="-30%" width="130%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b1"/>
      <feGaussianBlur stdDeviation="14" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Star Field Pattern -->
    <pattern id="starField" width="200" height="200" patternUnits="userSpaceOnUse">
      <circle cx="23"  cy="17"  r="0.6" fill="#F8FAFC" opacity="0.5"/>
      <circle cx="89"  cy="42"  r="0.4" fill="#94A3B8" opacity="0.35"/>
      <circle cx="150" cy="28"  r="0.8" fill="#F8FAFC" opacity="0.6"/>
      <circle cx="45"  cy="110" r="0.5" fill="#CBD5E1" opacity="0.4"/>
      <circle cx="170" cy="85"  r="0.4" fill="#94A3B8" opacity="0.3"/>
      <circle cx="112" cy="145" r="0.7" fill="#F8FAFC" opacity="0.55"/>
      <circle cx="30"  cy="175" r="0.4" fill="#64748B" opacity="0.25"/>
      <circle cx="185" cy="160" r="0.5" fill="#CBD5E1" opacity="0.45"/>
      <circle cx="78"  cy="72"  r="0.3" fill="#F8FAFC" opacity="0.2"/>
      <circle cx="140" cy="190" r="0.6" fill="#94A3B8" opacity="0.35"/>
    </pattern>
  </defs>

  <style>
    /* ═══ ORBITAL MECHANICS ═══ */
    @keyframes orbitA { 0%{transform:rotate(0deg);} 100%{transform:rotate(360deg);} }
    @keyframes orbitB { 0%{transform:rotate(360deg);} 100%{transform:rotate(0deg);} }
    @keyframes orbitC { 0%{transform:rotate(180deg);} 100%{transform:rotate(540deg);} }

    /* ═══ CELESTIAL BODIES ═══ */
    @keyframes electronPulse { 0%,100%{r:4;opacity:0.7;} 50%{r:5.5;opacity:1;} }
    @keyframes coreBreath { 0%,100%{r:6;opacity:0.8;} 50%{r:8;opacity:1;} }
    @keyframes starTwinkle { 0%,100%{opacity:0.3;} 50%{opacity:0.9;} }

    /* ═══ CONSTELLATION PULSES ═══ */
    @keyframes constellationPulse { 0%{stroke-opacity:0.06;} 50%{stroke-opacity:0.25;} 100%{stroke-opacity:0.06;} }
    @keyframes constellationPulseB { 0%{stroke-opacity:0.08;} 50%{stroke-opacity:0.2;} 100%{stroke-opacity:0.08;} }

    /* ═══ TYPOGRAPHY ═══ */
    @keyframes chromShiftA { 0%,92%,100%{transform:translate(0,0);opacity:0;} 93%{transform:translate(2.5px,-1px);opacity:0.7;} 96%{transform:translate(-1.5px,1px);opacity:0.4;} }
    @keyframes chromShiftB { 0%,93%,100%{transform:translate(0,0);opacity:0;} 94%{transform:translate(-2px,1.5px);opacity:0.6;} 97%{transform:translate(1.5px,-0.5px);opacity:0.3;} }
    @keyframes terminalBlink { 0%,49%{opacity:1;} 50%,100%{opacity:0;} }

    /* ═══ PARTICLE DRIFT ═══ */
    @keyframes cosmicDrift { 0%{transform:translateY(0) scale(0.6);opacity:0;} 12%{opacity:0.9;} 88%{opacity:0.4;} 100%{transform:translateY(-380px) scale(1.3);opacity:0;} }

    /* ═══ CLASSES ═══ */
    .orbit-a { transform-origin: 770px 195px; animation: orbitA 22s linear infinite; }
    .orbit-b { transform-origin: 770px 195px; animation: orbitB 15s linear infinite; }
    .orbit-c { transform-origin: 770px 195px; animation: orbitC 32s linear infinite; }
    .electron { animation: electronPulse 2.4s ease-in-out infinite; }
    .core-node { animation: coreBreath 3s ease-in-out infinite; }
    .star { animation: starTwinkle 4s ease-in-out infinite; }
    .constellation { animation: constellationPulse 5s ease-in-out infinite; }
    .constellation-b { animation: constellationPulseB 7s ease-in-out infinite; }
    .chrom-a { animation: chromShiftA 5s infinite; }
    .chrom-b { animation: chromShiftB 5s 0.06s infinite; }
    .term-cursor { animation: terminalBlink 0.85s step-end infinite; }
    .cosmic-particle { animation: cosmicDrift linear infinite; }

    text { font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', 'Fira Code', Menlo, Consolas, monospace; }
  </style>

  <!-- ═══════════ COSMIC CANVAS ═══════════ -->
  <rect width="1000" height="400" rx="16" fill="url(#cosmicVoid)"/>
  <rect width="1000" height="400" rx="16" fill="url(#starField)" opacity="0.8"/>
  <rect width="1000" height="400" rx="16" fill="url(#nebulaCyan)"/>
  <rect width="1000" height="400" rx="16" fill="url(#nebulaFlame)"/>
  <rect width="1000" height="400" rx="16" fill="url(#nebulaEmerald)"/>

  <!-- ═══════════ NEURAL CONSTELLATION MESH ═══════════ -->
  <!-- Deep background connections between anchor stars -->
  <g>
    <line class="constellation" x1="120" y1="60" x2="310" y2="130" stroke="url(#constellationLine)" stroke-width="0.8"/>
    <line class="constellation-b" x1="310" y1="130" x2="480" y2="80" stroke="url(#constellationLine)" stroke-width="0.6"/>
    <line class="constellation" x1="480" y1="80" x2="620" y2="140" stroke="url(#constellationLine)" stroke-width="0.7"/>
    <line class="constellation-b" x1="120" y1="60" x2="200" y2="180" stroke="url(#constellationLine)" stroke-width="0.5"/>
    <line class="constellation" x1="200" y1="180" x2="400" y2="240" stroke="url(#constellationLine)" stroke-width="0.6"/>
    <line class="constellation-b" x1="400" y1="240" x2="580" y2="310" stroke="url(#constellationLine)" stroke-width="0.5"/>
    <line class="constellation" x1="80" y1="320" x2="200" y2="180" stroke="url(#constellationLine)" stroke-width="0.6"/>
    <line class="constellation-b" x1="580" y1="310" x2="620" y2="140" stroke="url(#constellationLine)" stroke-width="0.7"/>
  </g>

  <!-- Constellation Anchor Stars -->
  <g>
    <circle class="star" cx="120" cy="60"  r="2"   fill="#F8FAFC" filter="url(#electronGlow)" style="animation-delay:0s;"/>
    <circle class="star" cx="310" cy="130" r="2.5" fill="#00F0FF" filter="url(#electronGlow)" style="animation-delay:0.8s;"/>
    <circle class="star" cx="480" cy="80"  r="1.8" fill="#F8FAFC" filter="url(#electronGlow)" style="animation-delay:1.6s;"/>
    <circle class="star" cx="620" cy="140" r="2.2" fill="#FF9100" filter="url(#electronGlow)" style="animation-delay:2.4s;"/>
    <circle class="star" cx="200" cy="180" r="1.5" fill="#CBD5E1" filter="url(#electronGlow)" style="animation-delay:0.5s;"/>
    <circle class="star" cx="400" cy="240" r="1.8" fill="#00E676" filter="url(#electronGlow)" style="animation-delay:1.2s;"/>
    <circle class="star" cx="580" cy="310" r="2"   fill="#38BDF8" filter="url(#electronGlow)" style="animation-delay:2s;"/>
    <circle class="star" cx="80"  cy="320" r="1.6" fill="#F8FAFC" filter="url(#electronGlow)" style="animation-delay:3s;"/>
  </g>

  <!-- ═══════════ COSMIC PARTICLE ASCENT ═══════════ -->
  <g>
    <circle class="cosmic-particle" cx="140" cy="380" r="1.4" fill="#00F0FF" style="animation-duration:9s;animation-delay:0s;"/>
    <circle class="cosmic-particle" cx="350" cy="390" r="1.0" fill="#38BDF8" style="animation-duration:12s;animation-delay:2s;"/>
    <circle class="cosmic-particle" cx="520" cy="385" r="1.6" fill="#00E676" style="animation-duration:10s;animation-delay:1s;"/>
    <circle class="cosmic-particle" cx="680" cy="380" r="1.2" fill="#FF9100" style="animation-duration:8s;animation-delay:0.5s;"/>
    <circle class="cosmic-particle" cx="870" cy="390" r="1.4" fill="#FF5722" style="animation-duration:11s;animation-delay:3s;"/>
  </g>

  <!-- ═══════════ OUTER HULL ═══════════ -->
  <rect x="10" y="10" width="980" height="380" rx="14" fill="none" stroke="url(#hullRim)" stroke-width="1"/>

  <!-- Precision Chamfer Corners -->
  <path d="M 22 18 L 46 18 M 22 18 L 22 42" stroke="#00F0FF" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M 978 18 L 954 18 M 978 18 L 978 42" stroke="#FF5722" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M 22 382 L 46 382 M 22 382 L 22 358" stroke="#00F0FF" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M 978 382 L 954 382 M 978 382 L 978 358" stroke="#FF5722" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- ═══════════ ORBITAL REACTOR SYSTEM (RIGHT) ═══════════ -->
  <!-- Orbit Ring C — Outermost (Slow, Wide) -->
  <ellipse class="orbit-c" cx="770" cy="195" rx="130" ry="100" fill="none" stroke="url(#orbitGradEmerald)" stroke-width="0.8" stroke-dasharray="6 12"/>

  <!-- Orbit Ring A — Middle -->
  <ellipse class="orbit-a" cx="770" cy="195" rx="95" ry="70" fill="none" stroke="url(#orbitGradCyan)" stroke-width="1" stroke-dasharray="16 20"/>

  <!-- Orbit Ring B — Inner (Fast, Counter) -->
  <ellipse class="orbit-b" cx="770" cy="195" rx="58" ry="42" fill="none" stroke="url(#orbitGradFlame)" stroke-width="1.2" stroke-dasharray="10 14"/>

  <!-- Orbiting Electron Nodes -->
  <g class="orbit-a">
    <circle class="electron" cx="865" cy="195" r="4.5" fill="#00F0FF" filter="url(#electronGlow)"/>
    <circle class="electron" cx="675" cy="195" r="3.5" fill="#38BDF8" filter="url(#electronGlow)" style="animation-delay:1.2s;"/>
  </g>

  <g class="orbit-b">
    <circle class="electron" cx="828" cy="195" r="4" fill="#FF9100" filter="url(#electronGlow)" style="animation-delay:0.6s;"/>
    <circle class="electron" cx="712" cy="195" r="3" fill="#FF5722" filter="url(#electronGlow)" style="animation-delay:1.8s;"/>
  </g>

  <g class="orbit-c">
    <circle class="electron" cx="900" cy="195" r="3.5" fill="#00E676" filter="url(#electronGlow)" style="animation-delay:0.3s;"/>
  </g>

  <!-- Reactor Core -->
  <circle cx="770" cy="195" r="12" fill="#070C18" stroke="#1E293B" stroke-width="1.5"/>
  <circle class="core-node" cx="770" cy="195" r="6" fill="#00F0FF" filter="url(#starGlow)"/>

  <!-- Reactor Data Label -->
  <text x="770" y="312" text-anchor="middle" font-size="9" font-weight="800" fill="#00F0FF" letter-spacing="1.8" opacity="0.7">VECTOR REACTOR</text>
  <text x="770" y="326" text-anchor="middle" font-size="8" fill="#475569" letter-spacing="1.2">ORBITAL MECHANICS STABLE</text>

  <!-- ═══════════ TOP TELEMETRY STRIP ═══════════ -->
  <g transform="translate(48, 44)">
    <circle class="core-node" cx="6" cy="-4" r="4" fill="#00E676" filter="url(#electronGlow)"/>
    <text x="22" y="0" font-size="11" font-weight="800" fill="#00E676" letter-spacing="2">SYS_ONLINE // v4.2.0</text>

    <text x="210" y="0" font-size="11" fill="#1E293B">|</text>
    <text x="228" y="0" font-size="11" fill="#94A3B8" letter-spacing="1.5">AHMEDABAD (23.02°N, 72.57°E)</text>

    <text x="510" y="0" font-size="11" fill="#1E293B">|</text>
    <text x="528" y="0" font-size="11" fill="#64748B" letter-spacing="1.5">INDUS UNIVERSITY</text>
  </g>

  <!-- Accent Horizon Line -->
  <line x1="48" y1="66" x2="620" y2="66" stroke="#1E293B" stroke-width="0.8"/>
  <line x1="48" y1="66" x2="200" y2="66" stroke="#00F0FF" stroke-width="0.8" opacity="0.5"/>

  <!-- ═══════════ HERO IDENTITY ═══════════ -->
  <g transform="translate(48, 182)">
    <text class="chrom-a" x="0" y="0" font-size="96" font-weight="900" fill="#00F0FF" letter-spacing="-4">HARMIT</text>
    <text class="chrom-b" x="0" y="0" font-size="96" font-weight="900" fill="#FF5722" letter-spacing="-4">HARMIT</text>
    <text x="0" y="0" font-size="96" font-weight="900" fill="url(#nameIridescent)" filter="url(#nameGlowUltra)" letter-spacing="-4">HARMIT</text>
  </g>

  <g transform="translate(48, 240)">
    <text font-size="36" font-weight="700" fill="#475569" letter-spacing="16">KALAL</text>
  </g>

  <!-- ═══════════ DOMAIN CAPSULES ═══════════ -->
  <g transform="translate(48, 298)">
    <g>
      <rect x="0" y="-20" width="172" height="30" rx="15" fill="none" stroke="#00F0FF" stroke-opacity="0.5" stroke-width="1"/>
      <circle cx="16" cy="-5" r="3.5" fill="#00F0FF" filter="url(#electronGlow)"/>
      <text x="28" y="-1" font-size="10.5" font-weight="800" fill="#00F0FF" letter-spacing="1.2">AI &amp; AGENTIC ARCH</text>
    </g>

    <g transform="translate(184, 0)">
      <rect x="0" y="-20" width="180" height="30" rx="15" fill="none" stroke="#FF9100" stroke-opacity="0.5" stroke-width="1"/>
      <circle cx="16" cy="-5" r="3.5" fill="#FF9100" filter="url(#electronGlow)"/>
      <text x="28" y="-1" font-size="10.5" font-weight="800" fill="#FF9100" letter-spacing="1.2">MALWARE &amp; DEFENSE</text>
    </g>

    <g transform="translate(376, 0)">
      <rect x="0" y="-20" width="162" height="30" rx="15" fill="none" stroke="#00E676" stroke-opacity="0.5" stroke-width="1"/>
      <circle cx="16" cy="-5" r="3.5" fill="#00E676" filter="url(#electronGlow)"/>
      <text x="28" y="-1" font-size="10.5" font-weight="800" fill="#00E676" letter-spacing="1.2">FULL-STACK &amp; SIM</text>
    </g>
  </g>

  <!-- ═══════════ BOTTOM CLI ═══════════ -->
  <g transform="translate(48, 364)">
    <text font-size="12" fill="#64748B">
      <tspan fill="#00F0FF" font-weight="700">$</tspan> <tspan fill="#F1F5F9">npx tribunal-kit init</tspan> <tspan fill="#334155">--target</tspan> <tspan fill="#FF9100" font-weight="700">@Harmitx7</tspan><tspan class="term-cursor" fill="#00F0FF"> ▌</tspan>
    </text>
  </g>

  <text x="952" y="364" text-anchor="end" font-size="10" fill="#334155" letter-spacing="1">REACTOR: <tspan fill="#00E676" font-weight="700">NOMINAL</tspan></text>
</svg>
