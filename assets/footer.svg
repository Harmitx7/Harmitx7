<svg width="100%" viewBox="0 0 1000 130" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fWaveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
    <filter id="fGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    @keyframes drift { to { stroke-dashoffset: -400; } }
    @keyframes glow { 0%,100%{opacity:0.8} 50%{opacity:1} }
    .wave { animation: drift 8s linear infinite; }
    .sig { animation: glow 4s ease-in-out infinite; }
    text { font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Monaco, Consolas, 'Courier New', monospace; }
  </style>

  <rect width="1000" height="130" fill="#080706"/>

  <!-- Top Border Gradient Rule -->
  <rect x="0" y="0" width="1000" height="1" fill="url(#fWaveGrad)" opacity="0.3"/>

  <!-- Subtle Dashed Telemetry Wave Line -->
  <path class="wave" d="M0,32 C 150,12 250,52 400,32 S 650,12 800,32 S 950,52 1000,32"
        fill="none" stroke="url(#fWaveGrad)" stroke-width="1.4" stroke-dasharray="10 8" opacity="0.45"/>

  <!-- Philosophy Quote -->
  <text class="sig" x="500" y="70" text-anchor="middle" font-size="15" font-weight="600" fill="#FAFAF9" filter="url(#fGlow)">
    "Build the real tool first. Document and promote second."
  </text>

  <!-- Sub-location Tag -->
  <text x="500" y="98" text-anchor="middle" font-size="11" fill="#78716C" letter-spacing="2">
    AHMEDABAD, INDIA · COMPUTER ENGINEERING · INDUS UNIVERSITY
  </text>

  <!-- Bottom Accent Dots -->
  <circle cx="480" cy="116" r="1.5" fill="#FF6B35" opacity="0.6"/>
  <circle cx="500" cy="116" r="1.5" fill="#F59E0B" opacity="0.6"/>
  <circle cx="520" cy="116" r="1.5" fill="#00F0FF" opacity="0.6"/>
</svg>
