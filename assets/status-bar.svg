<svg width="100%" viewBox="0 0 960 72" fill="none" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Active Shipping Telemetry Ticker — Harmitx7</title>
  <desc>Real-time operational status, active sprint focus, and hackathon milestones.</desc>
  <defs>
    <linearGradient id="stBarVoid" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#030509"/>
  <stop offset="50%" stop-color="#090E1A"/>
  <stop offset="100%" stop-color="#030509"/>
</linearGradient>
    <linearGradient id="stBarRim" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.600"/>
  <stop offset="35%" stop-color="#0F172A" stop-opacity="0.150"/>
  <stop offset="70%" stop-color="#1E293B" stop-opacity="0.150"/>
  <stop offset="100%" stop-color="#FF6B00" stop-opacity="0.600"/>
</linearGradient>
    <filter id="stBarGlow" x="-30%" y="-30%" width="160%" height="160%">
  <feGaussianBlur stdDeviation="2.5" result="blur"/>
  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>
  </defs>
  <style>
    text { font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', 'Fira Code', Menlo, Consolas, monospace; }
    @keyframes constellationBreath { 0%,100%{stroke-opacity:0.08;} 50%{stroke-opacity:0.3;} }
    @keyframes nodeGlow { 0%,100%{opacity:0.6;r:3;} 50%{opacity:1;r:4.5;} }
    @keyframes sonarRipple { 0%{r:4;opacity:0.9;} 100%{r:16;opacity:0;} }
    .beacon-node { animation: nodeGlow 2.4s ease-in-out infinite; }
    .const-line { animation: constellationBreath 5s ease-in-out infinite; }
    .sonar { animation: sonarRipple 2.4s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
    @media (prefers-reduced-motion: reduce) {
      .beacon-node { animation: none !important; opacity: 1 !important; }
      .const-line { animation: none !important; opacity: 1 !important; }
      .sonar { animation: none !important; opacity: 1 !important; }
    }
  </style>
  <rect x="0" y="0" width="960" height="72" rx="12" fill="url(#stBarVoid)" stroke="url(#stBarRim)" stroke-width="1.0"/>
  <g opacity="0.500">
  <line x1="80" y1="20" x2="260" y2="50" stroke="#00F0FF" stroke-width="0.6" class="const-line"/>
  <line x1="340" y1="52" x2="580" y2="22" stroke="#FF6B00" stroke-width="0.6" class="const-line"/>
  <line x1="680" y1="24" x2="880" y2="48" stroke="#00E676" stroke-width="0.6" class="const-line"/>
</g>
  <g transform="translate(28, 22)">
  <circle cx="10" cy="14" r="10" fill="none" stroke="#00E676" stroke-width="1.0" opacity="0.400" class="sonar"/>
  <circle cx="10" cy="14" r="3.5" fill="#00E676" class="beacon-node" filter="url(#stBarGlow)"/>
  <text x="28" y="18" fill="#F8FAFC" font-family="'Geist Mono', ui-monospace, 'Cascadia Code', 'Source Code Pro', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="11.5"><tspan fill="#64748B" font-weight="500">SYSTEM STATUS: </tspan><tspan fill="#00E676" font-weight="700">OPERATIONAL</tspan></text>
</g>
  <line x1="285" y1="20" x2="285" y2="52" stroke="#1E293B" stroke-width="0.8"/>
  <g transform="translate(305, 22)">
  <circle cx="8" cy="14" r="2.5" fill="#00F0FF"/>
  <text x="22" y="18" fill="#F8FAFC" font-family="'Geist Mono', ui-monospace, 'Cascadia Code', 'Source Code Pro', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="11.5"><tspan fill="#64748B" font-weight="500">ACTIVE SPRINT: </tspan><tspan fill="#00F0FF" font-weight="700">tribunal-kit v3.0</tspan><tspan fill="#334155"> (Anti-Hallucination SDD)</tspan></text>
</g>
  <line x1="670" y1="20" x2="670" y2="52" stroke="#1E293B" stroke-width="0.8"/>
  <g transform="translate(690, 22)">
  <circle cx="8" cy="14" r="2.5" fill="#FF6B00"/>
  <text x="22" y="18" fill="#F8FAFC" font-family="'Geist Mono', ui-monospace, 'Cascadia Code', 'Source Code Pro', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="11.5"><tspan fill="#64748B" font-weight="500">BOI HACKATHON: </tspan><tspan fill="#FF6B00" font-weight="800">WINNER</tspan></text>
</g>
  <text x="942" y="40" fill="#64748B" font-family="'Geist Mono', ui-monospace, 'Cascadia Code', 'Source Code Pro', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="10.0" font-weight="600" text-anchor="end" letter-spacing="0.5">@Harmitx7</text>
</svg>