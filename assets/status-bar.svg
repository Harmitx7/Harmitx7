<svg width="100%" viewBox="0 0 920 76" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sbBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#12100E"/>
      <stop offset="50%" stop-color="#0C0A09"/>
      <stop offset="100%" stop-color="#12100E"/>
    </linearGradient>
    <linearGradient id="sbAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
    <filter id="glowGreen" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseGreen { 0%,100%{opacity:0.5;r:4} 50%{opacity:1;r:5.5} }
    @keyframes slideItem { 0%{opacity:0;transform:translateX(-10px)} 100%{opacity:1;transform:translateX(0)} }
    .dot { animation: pulseGreen 2s ease-in-out infinite; }
    .item { opacity:0; animation: slideItem 0.6s ease-out forwards; }
    text { font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Monaco, Consolas, 'Courier New', monospace; }
  </style>

  <!-- Background container -->
  <rect width="920" height="76" rx="10" fill="url(#sbBg)" stroke="#292524" stroke-width="1.2"/>

  <!-- Left Status Indicator -->
  <g transform="translate(24, 42)">
    <circle class="dot" cx="0" cy="-4" r="4.5" fill="#4ADE80" filter="url(#glowGreen)"/>
    <text class="item" x="14" y="0" font-size="12" font-weight="700" fill="#A8A29E" letter-spacing="2" style="animation-delay:0.1s">ACTIVE_SHIPPING</text>
  </g>

  <!-- Divider Rule -->
  <rect x="180" y="20" width="1" height="36" fill="#292524"/>

  <!-- Item 1: tribunal-kit -->
  <g transform="translate(202, 42)">
    <text class="item" font-size="12" style="animation-delay:0.3s">
      <tspan fill="#FF6B35" font-weight="700">tribunal-kit</tspan><tspan fill="#78716C"> — anti-hallucination AI agents</tspan>
    </text>
  </g>

  <!-- Dot separator -->
  <circle cx="510" cy="38" r="2" fill="#44403C"/>

  <!-- Item 2: .acf format -->
  <g transform="translate(526, 42)">
    <text class="item" font-size="12" style="animation-delay:0.5s">
      <tspan fill="#00F0FF" font-weight="700">.acf pipeline</tspan><tspan fill="#78716C"> — LLM-native context</tspan>
    </text>
  </g>

  <!-- Dot separator -->
  <circle cx="770" cy="38" r="2" fill="#44403C"/>

  <!-- Item 3: ARGUS-X -->
  <g transform="translate(786, 42)">
    <text class="item" font-size="12" style="animation-delay:0.7s">
      <tspan fill="#F59E0B" font-weight="700">ARGUS-X</tspan>
    </text>
  </g>

  <!-- Bottom Accent Gradient Line -->
  <rect x="0" y="73" width="920" height="3" rx="1.5" fill="url(#sbAccent)" opacity="0.45"/>
</svg>
