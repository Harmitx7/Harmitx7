<svg width="100%" viewBox="0 0 960 72" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="stBarVoid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#020205"/>
      <stop offset="50%" stop-color="#0A0E1A"/>
      <stop offset="100%" stop-color="#020205"/>
    </linearGradient>

    <linearGradient id="stBarRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#0F172A" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FF5722" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="constellationStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#00E676" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FF9100" stop-opacity="0.3"/>
    </linearGradient>

    <filter id="stBarGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    @keyframes sonarRipple { 0%{r:4;opacity:0.9;} 100%{r:16;opacity:0;} }
    @keyframes nodeGlow { 0%,100%{opacity:0.5;r:2;} 50%{opacity:1;r:3;} }
    @keyframes constellationBreath { 0%,100%{stroke-opacity:0.08;} 50%{stroke-opacity:0.3;} }
    @keyframes podReveal { 0%{opacity:0;transform:translateY(5px);} 100%{opacity:1;transform:translateY(0);} }

    .sonar { animation: sonarRipple 2.4s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
    .const-node { animation: nodeGlow 3s ease-in-out infinite; }
    .const-line { animation: constellationBreath 5s ease-in-out infinite; }
    .pod { animation: podReveal 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity:0; }

    text { font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', 'Fira Code', Menlo, Consolas, monospace; }
  </style>

  <!-- Background Capsule -->
  <rect width="960" height="72" rx="12" fill="url(#stBarVoid)" stroke="url(#stBarRim)" stroke-width="1"/>

  <!-- Background Micro Constellation -->
  <g>
    <line class="const-line" x1="80" y1="20" x2="260" y2="50" stroke="url(#constellationStroke)" stroke-width="0.6"/>
    <line class="const-line" x1="260" y1="50" x2="450" y2="24" stroke="url(#constellationStroke)" stroke-width="0.5" style="animation-delay:1s;"/>
    <line class="const-line" x1="450" y1="24" x2="680" y2="48" stroke="url(#constellationStroke)" stroke-width="0.6" style="animation-delay:2s;"/>
    <line class="const-line" x1="680" y1="48" x2="900" y2="22" stroke="url(#constellationStroke)" stroke-width="0.5" style="animation-delay:0.5s;"/>

    <circle class="const-node" cx="80"  cy="20" r="2" fill="#00F0FF" filter="url(#stBarGlow)" style="animation-delay:0s;"/>
    <circle class="const-node" cx="260" cy="50" r="2" fill="#38BDF8" filter="url(#stBarGlow)" style="animation-delay:0.8s;"/>
    <circle class="const-node" cx="450" cy="24" r="2" fill="#00E676" filter="url(#stBarGlow)" style="animation-delay:1.6s;"/>
    <circle class="const-node" cx="680" cy="48" r="2" fill="#FF9100" filter="url(#stBarGlow)" style="animation-delay:0.4s;"/>
    <circle class="const-node" cx="900" cy="22" r="2" fill="#FF5722" filter="url(#stBarGlow)" style="animation-delay:1.2s;"/>
  </g>

  <!-- Left Active Beacon with Sonar -->
  <g transform="translate(26, 40)">
    <circle class="sonar" cx="0" cy="-4" r="4" fill="none" stroke="#00E676" stroke-width="1"/>
    <circle cx="0" cy="-4" r="4.5" fill="#00E676" filter="url(#stBarGlow)"/>
    <text class="pod" x="16" y="0" font-size="11" font-weight="900" fill="#00E676" letter-spacing="2.5" style="animation-delay:0.05s;">LIVE</text>
  </g>

  <!-- Separator -->
  <line x1="108" y1="18" x2="108" y2="54" stroke="#1E293B" stroke-width="1"/>

  <!-- Pod 1: tribunal-kit -->
  <g class="pod" transform="translate(128, 40)" style="animation-delay:0.15s;">
    <text font-size="11.5">
      <tspan fill="#00F0FF" font-weight="700">tribunal-kit</tspan>
      <tspan fill="#475569"> — 52 agents &amp; 21 reviewers</tspan>
    </text>
  </g>

  <!-- Node Separator 1 -->
  <circle cx="402" cy="36" r="2" fill="#00F0FF" opacity="0.5"/>

  <!-- Pod 2: .acf compiler -->
  <g class="pod" transform="translate(420, 40)" style="animation-delay:0.3s;">
    <text font-size="11.5">
      <tspan fill="#FF9100" font-weight="700">.acf compiler</tspan>
      <tspan fill="#475569"> — 27x distillation</tspan>
    </text>
  </g>

  <!-- Node Separator 2 -->
  <circle cx="654" cy="36" r="2" fill="#FF9100" opacity="0.5"/>

  <!-- Pod 3: ARGUS-X -->
  <g class="pod" transform="translate(672, 40)" style="animation-delay:0.45s;">
    <text font-size="11.5">
      <tspan fill="#00E676" font-weight="700">ARGUS-X</tspan>
      <tspan fill="#475569"> — BoI Hackathon Winner</tspan>
    </text>
  </g>
</svg>
