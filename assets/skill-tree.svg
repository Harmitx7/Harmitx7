      <text class="pill" x="210" y="18" font-size="11" fill="#FAFAF9" style="animation-delay:0.59s">C++</text>

      <rect class="pill" x="276" y="0" width="134" height="28" rx="6" fill="#1C1917" stroke="#00F0FF" stroke-opacity="0.4" style="animation-delay:0.66s"/>
      <text class="pill" x="288" y="18" font-size="11" fill="#FAFAF9" style="animation-delay:0.66s">Microservices</text>

      <rect class="pill" x="420" y="0" width="128" height="28" rx="6" fill="#1C1917" stroke="#00F0FF" stroke-opacity="0.4" style="animation-delay:0.73s"/>
      <text class="pill" x="432" y="18" font-size="11" fill="#FAFAF9" style="animation-delay:0.73s">SQL / DuckDB</text>

      <rect class="pill" x="558" y="0" width="80" height="28" rx="6" fill="#1C1917" stroke="#00F0FF" stroke-opacity="0.4" style="animation-delay:0.8s"/>
      <text class="pill" x="570" y="18" font-size="11" fill="#FAFAF9" style="animation-delay:0.8s">Docker</text>
    </g>
  </g>

  <line x1="36" y1="214" x2="884" y2="214" stroke="#292524" stroke-width="1"/>

