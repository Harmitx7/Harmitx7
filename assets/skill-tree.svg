  <!-- Footer Accent Bar -->
  <g transform="translate(36, 400)">
    <rect x="0" y="0" width="60" height="2" rx="1" fill="#FF6B35" opacity="0.6"/>
    <rect x="70" y="0" width="30" height="2" rx="1" fill="#00F0FF" opacity="0.5"/>
    <text x="848" y="4" font-size="10" fill="#57534E" text-anchor="end">4 DEPLOYED PILLARS</text>
