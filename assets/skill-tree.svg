  <g transform="translate(36, 180)">
    <circle class="catDot" cx="6" cy="-4" r="5" fill="#00F0FF" filter="url(#glowDot)"/>
    <text x="20" y="0" font-size="12" font-weight="700" fill="#00F0FF" letter-spacing="1.5">SYSTEMS &amp; ARCH</text>

    <g transform="translate(200, -14)">
      <rect class="pill" x="0" y="0" width="82" height="28" rx="6" fill="#1C1917" stroke="#00F0FF" stroke-opacity="0.4" style="animation-delay:0.45s"/>
      <text class="pill" x="12" y="18" font-size="11" fill="#FAFAF9" style="animation-delay:0.45s">Python</text>

      <rect class="pill" x="92" y="0" width="96" height="28" rx="6" fill="#1C1917" stroke="#00F0FF" stroke-opacity="0.4" style="animation-delay:0.52s"/>
