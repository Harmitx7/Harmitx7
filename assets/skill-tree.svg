<svg width="100%" viewBox="0 0 920 440" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="stBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090807"/>
      <stop offset="100%" stop-color="#141210"/>
    </linearGradient>
    <linearGradient id="headerAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
    <filter id="glowDot" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes fadePill { 0%{opacity:0;transform:translateY(6px)} 100%{opacity:1;transform:translateY(0)} }
    @keyframes pulseNode { 0%,100%{opacity:0.6;r:5} 50%{opacity:1;r:6.5} }
    .pill { animation: fadePill 0.4s ease-out forwards; opacity:0; }
    .catDot { animation: pulseNode 2.5s ease-in-out infinite; }
    text { font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Monaco, Consolas, 'Courier New', monospace; }
  </style>

  <!-- Container Base -->
  <rect width="920" height="440" rx="12" fill="url(#stBg)" stroke="#292524" stroke-width="1.2"/>

  <!-- Header Bar -->
  <g transform="translate(36, 44)">
    <text x="0" y="0" font-size="11" fill="#78716C" letter-spacing="3" font-weight="700">SKILL_MATRIX // TECHNICAL_STACK_LANDSCAPE</text>
    <rect x="0" y="10" width="120" height="2" rx="1" fill="url(#headerAccent)" opacity="0.8"/>
  </g>

  <!-- ═══ ROW 1: AI & AGENTIC SYSTEMS ═══ -->
  <g transform="translate(36, 100)">
    <circle class="catDot" cx="6" cy="-4" r="5" fill="#FF6B35" filter="url(#glowDot)"/>
    <text x="20" y="0" font-size="12" font-weight="700" fill="#FF6B35" letter-spacing="1.5">AI &amp; AGENTIC</text>

    <!-- Pills -->
    <g transform="translate(200, -14)">
      <rect class="pill" x="0" y="0" width="116" height="28" rx="6" fill="#1C1917" stroke="#FF6B35" stroke-opacity="0.4" style="animation-delay:0.05s"/>
      <text class="pill" x="12" y="18" font-size="11" fill="#FAFAF9" style="animation-delay:0.05s">tribunal-kit</text>

      <rect class="pill" x="126" y="0" width="112" height="28" rx="6" fill="#1C1917" stroke="#FF6B35" stroke-opacity="0.4" style="animation-delay:0.12s"/>
      <text class="pill" x="138" y="18" font-size="11" fill="#FAFAF9" style="animation-delay:0.12s">LLM Agents</text>

      <rect class="pill" x="248" y="0" width="138" height="28" rx="6" fill="#1C1917" stroke="#FF6B35" stroke-opacity="0.4" style="animation-delay:0.19s"/>
      <text class="pill" x="260" y="18" font-size="11" fill="#FAFAF9" style="animation-delay:0.19s">.acf Distillation</text>

      <rect class="pill" x="396" y="0" width="124" height="28" rx="6" fill="#1C1917" stroke="#FF6B35" stroke-opacity="0.4" style="animation-delay:0.26s"/>
      <text class="pill" x="408" y="18" font-size="11" fill="#FAFAF9" style="animation-delay:0.26s">RAG Pipelines</text>

      <rect class="pill" x="530" y="0" width="90" height="28" rx="6" fill="#1C1917" stroke="#FF6B35" stroke-opacity="0.4" style="animation-delay:0.33s"/>
      <text class="pill" x="542" y="18" font-size="11" fill="#FAFAF9" style="animation-delay:0.33s">PyTorch</text>

      <rect class="pill" x="630" y="0" width="40" height="28" rx="6" fill="#1C1917" stroke="#FF6B35" stroke-opacity="0.2" style="animation-delay:0.4s"/>
      <text class="pill" x="640" y="18" font-size="11" fill="#78716C" style="animation-delay:0.4s">+3</text>
    </g>
  </g>

  <line x1="36" y1="134" x2="884" y2="134" stroke="#292524" stroke-width="1"/>

