  <g transform="translate(36, 260)">
    <circle class="catDot" cx="6" cy="-4" r="5" fill="#F59E0B" filter="url(#glowDot)"/>
    <text x="20" y="0" font-size="12" font-weight="700" fill="#F59E0B" letter-spacing="1.5">FULL-STACK &amp; WEB</text>

