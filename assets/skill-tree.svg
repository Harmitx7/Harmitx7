      <rect class="pill" x="320" y="0" width="72" height="28" rx="6" fill="#1C1917" stroke="#F59E0B" stroke-opacity="0.4" style="animation-delay:1.06s"/>
      <text class="pill" x="332" y="18" font-size="11" fill="#FAFAF9" style="animation-delay:1.06s">tRPC</text>

      <rect class="pill" x="402" y="0" width="100" height="28" rx="6" fill="#1C1917" stroke="#F59E0B" stroke-opacity="0.4" style="animation-delay:1.13s"/>
      <text class="pill" x="414" y="18" font-size="11" fill="#FAFAF9" style="animation-delay:1.13s">Supabase</text>

      <rect class="pill" x="512" y="0" width="124" height="28" rx="6" fill="#1C1917" stroke="#F59E0B" stroke-opacity="0.4" style="animation-delay:1.20s"/>
      <text class="pill" x="524" y="18" font-size="11" fill="#FAFAF9" style="animation-delay:1.20s">Tailwind CSS</text>
    </g>
  </g>

  <line x1="36" y1="294" x2="884" y2="294" stroke="#292524" stroke-width="1"/>

  <!-- ═══ ROW 4: GAME DEV & DEFENSE ═══ -->
  <g transform="translate(36, 340)">
    <circle class="catDot" cx="6" cy="-4" r="5" fill="#4ADE80" filter="url(#glowDot)"/>
    <text x="20" y="0" font-size="12" font-weight="700" fill="#4ADE80" letter-spacing="1.5">GAME DEV &amp; DEFENSE</text>

    <g transform="translate(200, -14)">
      <rect class="pill" x="0" y="0" width="88" height="28" rx="6" fill="#1C1917" stroke="#4ADE80" stroke-opacity="0.4" style="animation-delay:1.25s"/>
      <text class="pill" x="12" y="18" font-size="11" fill="#FAFAF9" style="animation-delay:1.25s">Godot 4</text>

      <rect class="pill" x="98" y="0" width="94" height="28" rx="6" fill="#1C1917" stroke="#4ADE80" stroke-opacity="0.4" style="animation-delay:1.32s"/>
      <text class="pill" x="110" y="18" font-size="11" fill="#FAFAF9" style="animation-delay:1.32s">GDScript</text>

      <rect class="pill" x="202" y="0" width="168" height="28" rx="6" fill="#1C1917" stroke="#4ADE80" stroke-opacity="0.4" style="animation-delay:1.39s"/>
      <text class="pill" x="214" y="18" font-size="11" fill="#FAFAF9" style="animation-delay:1.39s">ARGUS-X Trigger Graph</text>

      <rect class="pill" x="380" y="0" width="92" height="28" rx="6" fill="#1C1917" stroke="#4ADE80" stroke-opacity="0.4" style="animation-delay:1.46s"/>
      <text class="pill" x="392" y="18" font-size="11" fill="#FAFAF9" style="animation-delay:1.46s">Three.js</text>

      <rect class="pill" x="482" y="0" width="144" height="28" rx="6" fill="#1C1917" stroke="#4ADE80" stroke-opacity="0.4" style="animation-delay:1.53s"/>
      <text class="pill" x="494" y="18" font-size="11" fill="#FAFAF9" style="animation-delay:1.53s">MITRE ATT&amp;CK</text>
    </g>
