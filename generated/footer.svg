<svg width="100%" viewBox="0 0 1000 140" fill="none" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Engineering Verification Footer — Harmit Kalal</title>
  <desc>Geographic coordinates (Ahmedabad, IN // 23.02°N, 72.57°E) and Indus University verification nodes.</desc>
  <defs>
    <linearGradient id="footVoid" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#030509"/>
  <stop offset="50%" stop-color="#090E1A"/>
  <stop offset="100%" stop-color="#030509"/>
</linearGradient>
    <linearGradient id="footStream" x1="0%" y1="0%" x2="100%" y2="0%">
  <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.800"/>
  <stop offset="40%" stop-color="#38BDF8" stop-opacity="0.800"/>
  <stop offset="70%" stop-color="#FF9100" stop-opacity="0.800"/>
  <stop offset="100%" stop-color="#FF5722" stop-opacity="0.800"/>
</linearGradient>
    <filter id="footGlow" x="-30%" y="-30%" width="160%" height="160%">
  <feGaussianBlur stdDeviation="2.0" result="blur"/>
  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>
  </defs>
  <style>
    text { font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', 'Fira Code', Menlo, Consolas, monospace; }
    @keyframes starPulse { 0%,100%{opacity:0.2;} 50%{opacity:0.75;} }
    @keyframes wavePhaseA { 0%{stroke-dashoffset:0;} 100%{stroke-dashoffset:-500;} }
    @keyframes wavePhaseB { 0%{stroke-dashoffset:-500;} 100%{stroke-dashoffset:0;} }
    .f-star { animation: starPulse 5s ease-in-out infinite; }
    .wave-a { stroke-dasharray: 14 8; animation: wavePhaseA 9.0s linear infinite; }
    .wave-b { stroke-dasharray: 10 12; animation: wavePhaseB 12.0s linear infinite; }
    @media (prefers-reduced-motion: reduce) {
      .f-star { animation: none !important; opacity: 1 !important; }
      .wave-a { animation: none !important; opacity: 1 !important; }
      .wave-b { animation: none !important; opacity: 1 !important; }
    }
  </style>
  <rect x="0" y="0" width="1000" height="140" rx="12" fill="url(#footVoid)"/>
  <rect x="0" y="0" width="1000" height="1.5" fill="url(#footStream)" opacity="0.800"/>
  <g opacity="0.400">
  <line x1="120" y1="30" x2="350" y2="55" stroke="#00F0FF" stroke-width="0.5" opacity="0.300"/>
  <line x1="350" y1="55" x2="580" y2="28" stroke="#00F0FF" stroke-width="0.5" opacity="0.300"/>
  <line x1="580" y1="28" x2="830" y2="52" stroke="#FF6B00" stroke-width="0.5" opacity="0.300"/>
  <circle cx="120" cy="30" r="1.5" fill="#00F0FF" class="f-star"/>
  <circle cx="350" cy="55" r="1.5" fill="#00F0FF" class="f-star"/>
  <circle cx="580" cy="28" r="1.5" fill="#FF6B00" class="f-star"/>
  <circle cx="830" cy="52" r="1.5" fill="#00E676" class="f-star"/>
</g>
  <path d="M 0 42 Q 125 16, 250 42 T 500 42 T 750 42 T 1000 42" fill="none" stroke="url(#footStream)" stroke-width="1.5" opacity="0.450" class="wave-a"/>
  <path d="M 0 42 Q 125 68, 250 42 T 500 42 T 750 42 T 1000 42" fill="none" stroke="#00E676" stroke-width="1.0" opacity="0.250" class="wave-b"/>
  <text x="500" y="84" fill="#64748B" font-family="'Geist Mono', ui-monospace, 'Cascadia Code', 'Source Code Pro', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="11.0" font-weight="600" text-anchor="middle" letter-spacing="2.0">AHMEDABAD, IN (23.02°N, 72.57°E) · COMPUTER ENGINEERING · INDUS UNIVERSITY</text>
  <g transform="translate(500, 116)">
  <circle cx="-24" cy="0" r="2.5" fill="#00F0FF"/>
  <circle cx="-8" cy="0" r="2.5" fill="#38BDF8"/>
  <circle cx="8" cy="0" r="2.5" fill="#FF6B00"/>
  <circle cx="24" cy="0" r="2.5" fill="#00E676"/>
</g>
</svg>